<div class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">ESG Intelligence System</p>
    <h1>Sign in to <em>your workspace</em></h1>

    <form
      #loginForm="ngForm"
      (ngSubmit)="onLogin()"
      novalidate
    >
      <div class="field-group">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="auditor@company.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="field-group">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <button
        type="submit"
        [disabled]="isLoading || loginForm.invalid"
      >
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>
  </div>

  <div class="auth-visual">
    <p class="eyebrow">IFRS S1/S2 Platform</p>
    <h2>
      Turn ESG data into
      <em>audit-ready reports</em>
    </h2>
    <p>
      Upload source data, prepare ESG indicators, generate IFRS-aligned reports,
      and submit them for expert approval.
    </p>
  </div>
</div>

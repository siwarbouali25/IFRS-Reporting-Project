<div class="auth-page">
  <div class="auth-card">
    <p class="eyebrow">Create Access</p>
    <h1>Sign up</h1>
    <p class="subtitle">Create a local demo account for the ESG platform.</p>

    <form>
      <label>Full name</label>
      <input type="text" placeholder="Miriam Ben Ouaghrem" />

      <label>Email</label>
      <input type="email" placeholder="name@company.com" />

      <label>Role</label>
      <select>
        <option>Auditor</option>
        <option>Expert Reviewer</option>
        <option>Admin</option>
      </select>

      <label>Password</label>
      <input type="password" placeholder="Create a password" />

      <button type="button" routerLink="/dashboard">Create Account</button>
    </form>

    <p class="switch">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>
  </div>

  <div class="auth-visual">
    <h2>Governance, Risk & IFRS Reporting</h2>
    <p>Designed for internal auditors reviewing ESG metrics and generated sustainability reports.</p>
  </div>
</div>
